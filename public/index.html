function loadState(){
  try{
    var did=localStorage.getItem('towed_did');

    state.totalChecks=parseInt(localStorage.getItem('towed_tc')||'1247');
  }catch(e){}
}

function saveState(){
  try{

    }));

}

function parseHours(h){
  if(!h) return {safe:true,info:'No restrictions found'};
  var now=new Date(),day=now.getDay(),hour=now.getHours(),str=h.toUpperCase();
  var m=str.match(/(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if(!m) return {safe:true,info:h};
  var start=parseInt(m[1]),end=parseInt(m[3]);
  if(str.indexOf('MON-SAT')>=0&&day===0) return {safe:true,info:'No restrictions on Sunday'};
  if(str.indexOf('MON-FRI')>=0&&(day===0||day===6)) return {safe:true,info:'No restrictions on weekends'};
  if(hour>=start&&hour<end) return {safe:false,info:'Restricted now until '+m[3]+':'+m[4]};
  return {safe:true,info:'Safe now. Restrictions '+m[1]+':'+m[2]+'-'+m[3]+':'+m[4]};
}

function getExpiry(mh){
  var now=new Date();
  if(!mh) return new Date(now.getTime()+7200000);
  var m=mh.toUpperCase().match(/(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if(m){var e=new Date();e.setHours(parseInt(m[3]),parseInt(m[4]),0,0);if(e<=now) return new Date(now.getTime()+7200000);return e;}
  return new Date(now.getTime()+7200000);
}

  var st=document.getElementById('map-status');

  var d=0.004;
  fetch(API+'?$where=lat>'+(lat-d)+' AND lat<'+(lat+d)+' AND long>'+(lng-d)+' AND long<'+(lng+d)+'&$limit=10')

function startTimer(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  updateTimer();
  state.timerInterval=setInterval(updateTimer,1000);

function updateTimer(){
  var el=document.getElementById('timer-display');
  var arc=document.getElementById('timer-arc');
  if(!el){clearInterval(state.timerInterval);return;}
  if(!state.parkedExpiry){el.textContent='--:--';return;}
  var now=new Date(),exp=new Date(state.parkedExpiry),pa=new Date(state.parkedAt);
  var total=exp-pa,diff=Math.max(0,exp-now),pct=total>0?diff/total:0;
  var h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  if(diff===0){el.textContent='EXPIRED';el.style.color='#FF6B3D';}
  else{
    el.textContent=h>0?h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    el.style.color=diff<600000?'#FF6B3D':diff<1800000?'#FFD60A':'#F2F2EE';
  }
  if(arc){arc.style.strokeDashoffset=666*(1-pct);arc.style.stroke=diff<600000?'#FF6B3D':diff<1800000?'#FFD60A':'#FFC83D';}
}

function reqNotif(expiry,street){
  if(!('Notification' in window)) return;
  Notification.requestPermission().then(function(p){if(p==='granted') schedNotif(expiry,street);});
}

function schedNotif(expiry,street){
  var now=new Date(),exp=new Date(expiry);
  var t30=exp.getTime()-1800000-now.getTime();
  var t10=exp.getTime()-600000-now.getTime();
  var t0=exp.getTime()-now.getTime();
  if(t30>0) setTimeout(function(){new Notification('🚗 TOWED — Move Your Car',{body:'Meter expires in 30 min on '+street,requireInteraction:true});},t30);
  if(t10>0) setTimeout(function(){new Notification('⚠️ TOWED — 10 Minutes Left',{body:'Meter expires in 10 min on '+street+'. Move NOW!',requireInteraction:true});},t10);
  if(t0>0) setTimeout(function(){new Notification('🚨 TOWED — Meter Expired',{body:'Your meter on '+street+' has expired!',requireInteraction:true});},t0);
}

function iParkHere(){
  var r=state.result;if(!r) return;
  var exp=getExpiry(r.meter_hours);
  state.parkedAt=new Date().toISOString();
  state.parkedExpiry=exp.toISOString();
  saveState();
  reqNotif(exp,r.on_street||'your spot');
  state.screen='parked';render();
}

function saveSpot(){
  if(!state.result||!state.user) return;
  if(!state.saved) state.saved=[];
  var exists=state.saved.find(function(s){return s.meter===state.lastMeter;});
  if(!exists){
    state.saved.unshift({meter:state.lastMeter,street:state.result.on_street||'Unknown',borough:state.result.borough||''});
    if(state.saved.length>10) state.saved=state.saved.slice(0,10);
    saveState();
    alert('Spot saved!');
  } else {
    alert('This spot is already saved.');
  }
}

function shareResult(text){
  var decoded=decodeURIComponent(text);
  if(navigator.share){
    navigator.share({title:'TOWED',text:decoded,url:'https://towed.nyc'}).catch(function(){});
  } else {
    navigator.clipboard.writeText(decoded).then(function(){alert('Copied to clipboard!');}).catch(function(){prompt('Copy this:',decoded);});
  }
}

function showCookieBanner(){
  if(localStorage.getItem('towed_cookie_ok')) return;
  var bar=document.getElementById('cookie-bar');
  if(!bar) return;
  bar.style.display='flex';
  bar.innerHTML='<div class="cookie-text">Towed uses cookies to remember your session and parking history. By using towed.nyc you agree to our <a href="#" onclick="goNav(\'privacy\')" style="color:#FFC83D">Privacy Policy</a>.</div>'+
    '<button class="cookie-btn" onclick="acceptCookies()">Got it</button>';
}

function acceptCookies(){
  localStorage.setItem('towed_cookie_ok','1');
  var bar=document.getElementById('cookie-bar');
  if(bar) bar.style.display='none';
}

function checkMeter(){
  var val=document.getElementById('meterInput').value.trim();
  if(!val) return;
  document.getElementById('meter-error').textContent='';
  document.getElementById('root').innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#8B8F98;font-size:15px;font-family:Archivo,sans-serif">Checking NYC parking rules...</div>';
  fetch(API+'?meter_number='+encodeURIComponent(val)+'&$limit=1')
    .then(function(r){return r.json();})
    .then(function(data){
      if(data&&data.length>0&&data[0].meter_number){
        var meter=data[0],parsed=parseHours(meter.meter_hours);
        state.result=Object.assign({},meter,parsed);
        state.lastMeter=val;
        if(!state.history) state.history=[];
        state.history.unshift({meter:val,street:meter.on_street||'Unknown',safe:parsed.safe,time:new Date().toISOString()});
        if(state.history.length>5) state.history=state.history.slice(0,5);
        state.totalChecks++;
        localStorage.setItem('towed_tc',state.totalChecks);
        saveState();
        state.screen='result';render();
        if(!state.user&&state.history.length===1) setTimeout(showSignupModal,2000);
      } else {
        state.screen='home';render();
        document.getElementById('meter-error').textContent='Meter not found. Check the 7-digit number on the post.';
        document.getElementById('meterInput').value=val;
      }
    })
    .catch(function(){
      state.screen='home';render();
      document.getElementById('meter-error').textContent='Connection error. Try again.';
    });
}

function quickCheck(meterNum){
  state.screen='home';render();
  setTimeout(function(){
    var inp=document.getElementById('meterInput');
    if(inp){inp.value=meterNum;checkMeter();}
    else{showMeterInput();setTimeout(function(){var i=document.getElementById('meterInput');if(i){i.value=meterNum;checkMeter();}},200);}
  },150);
}

function showSignupModal(){
  document.getElementById('modal-overlay').style.display='flex';
  document.getElementById('modal-overlay').innerHTML=
    '<div class="modal">'+
    '<div class="modal-handle"></div>'+
    '<div class="modal-title">Save your results & get alerts.</div>'+
    '<div class="modal-sub">Create a free account to get notified before your meter expires or street cleaning hits your block.</div>'+
    '<input class="modal-input" id="m-first" placeholder="First name"/>'+
    '<input class="modal-input" id="m-last" placeholder="Last name"/>'+
    '<input class="modal-input" id="m-email" type="email" placeholder="Email address"/>'+
    '<input class="modal-input" id="m-password" type="password" placeholder="Create a password (min 6 characters)"/>'+
    '<button style="width:100%;height:50px;background:#121418;color:#F4F3EE;border:none;border-radius:11px;font-family:Archivo,sans-serif;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:8px" onclick="signupFromModal()">Create free account →</button>'+
    '<div id="modal-err" style="color:#FF6B3D;font-size:11px;text-align:center;margin-top:4px"></div>'+
    '<button class="modal-skip" onclick="skipSignup()">Skip for now — keep using free</button>'+
    '</div>';
}

function signupFromModal(){
  var first=document.getElementById('m-first').value.trim();
  var last=document.getElementById('m-last').value.trim();
  var email=document.getElementById('m-email').value.trim();
  var password=document.getElementById('m-password').value.trim();
  var err=document.getElementById('modal-err');
  if(!first){err.textContent='Enter your first name.';return;}
  if(!last){err.textContent='Enter your last name.';return;}
  if(!email||email.indexOf('@')<0){err.textContent='Enter a valid email.';return;}
  if(!password||password.length<6){err.textContent='Password must be at least 6 characters.';return;}
  state.user={firstName:first,lastName:last,email:email};
  state.credits=999;
  saveState();
  fetch(SB_URL+'/rest/v1/Sign%20ups',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
    body:JSON.stringify({first_name:first,last_name:last,email:email,password:password,created_at:new Date().toISOString()})
  }).catch(function(e){console.log('SB:',e);});
  document.getElementById('modal-overlay').innerHTML=
    '<div class="modal" style="text-align:center">'+
    '<div style="font-size:52px;margin-bottom:14px">🎉</div>'+
    '<div style="font-weight:900;font-size:22px;color:#121418;margin-bottom:8px">You\'re in, '+first+'!</div>'+
    '<div style="font-size:13px;color:#4A4D55;margin-bottom:18px">Welcome to Towed. Check as many meters as you want — it\'s free forever.</div>'+
    '<div style="background:#0E1013;border-radius:10px;padding:12px;margin-bottom:18px">'+
    '<div style="font-size:11px;color:#8B8F98;margin-bottom:3px">Signed in as</div>'+
    '<div style="font-size:14px;font-weight:700;color:#F2F2EE">'+email+'</div>'+
    '</div>'+
    '<button style="width:100%;height:50px;background:#121418;color:#F4F3EE;border:none;border-radius:11px;font-family:Archivo,sans-serif;font-weight:800;font-size:15px;cursor:pointer" onclick="closeModal()">Start checking meters →</button>'+
    '</div>';
}

function closeModal(){
  document.getElementById('modal-overlay').style.display='none';
  render();
}

function skipSignup(){
  document.getElementById('modal-overlay').style.display='none';
}

function goNav(id){
  if(id==='home'||id==='check') state.screen='home';
  else if(id==='map') state.screen='map';
  else if(id==='parked') state.screen='parked';
  else if(id==='account') state.screen='account';
  else if(id==='privacy') state.screen='privacy';
  else if(id==='terms') state.screen='terms';
  else if(id==='faq') state.screen='faq';
  else if(id==='about') state.screen='about';
  render();
}

function goHome(){
  state.screen='home';render();
}

function signOut(){
  state.user=null;state.credits=999;
  localStorage.removeItem('towed_v7');
  state.screen='home';render();
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(e){console.log('SW:',e);});
}

loadState();
render();
</script>
