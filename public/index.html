<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOWED — NYC Parking Survival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0E1013;font-family:'Archivo','Helvetica Neue',sans-serif;color:#F2F2EE;min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}
.wrap{max-width:480px;margin:0 auto;padding:20px;}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:24px 0 32px;}
.logo{font-weight:900;font-size:24px;letter-spacing:.08em;color:#FFC83D;}
.credits-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 12px;border:1px solid #3A3D44;border-radius:999px;color:#C9CBD1;}
.credits-pill.warn{border-color:#5A3A2E;color:#FFB199;}

/* Hero */
.hero{padding:16px 0 32px;}
.hero-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#FFC83D;margin-bottom:16px;}
.hero-h1{font-weight:900;font-size:clamp(40px,10vw,72px);line-height:.95;letter-spacing:-.02em;margin-bottom:16px;}
.hero-sub{font-size:17px;line-height:1.5;color:#B9BCC3;margin-bottom:28px;}

/* Lookup */
.lookup-box{background:#181B20;border-radius:20px;padding:20px;margin-bottom:12px;}
.lookup-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#8B8F98;margin-bottom:12px;}
input{width:100%;background:#0E1013;border:1.5px solid #3A3D44;border-radius:12px;padding:16px;color:#F2F2EE;font-family:'Archivo',sans-serif;font-size:16px;outline:none;transition:border-color .2s;}
input:focus{border-color:#FFC83D;}
input::placeholder{color:#3A3D44;}
.check-btn{width:100%;height:56px;margin-top:10px;background:#FFC83D;border:none;border-radius:14px;color:#0E1013;font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;cursor:pointer;transition:opacity .2s;}
.check-btn:hover{opacity:.9;}
.error-msg{color:#FF6B3D;font-size:12px;margin-top:8px;font-family:'IBM Plex Mono',monospace;}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:32px;}
.stat{background:#181B20;border-radius:14px;padding:16px 12px;text-align:center;}
.stat-num{font-weight:900;font-size:22px;color:#FFC83D;}
.stat-lbl{font-size:11px;color:#8B8F98;margin-top:4px;line-height:1.3;}

/* How it works */
.how{margin-bottom:40px;}
.section-title{font-weight:900;font-size:28px;margin-bottom:20px;}
.step{background:#181B20;border-radius:16px;padding:20px;margin-bottom:8px;display:flex;gap:16px;align-items:flex-start;}
.step-num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;color:#FFC83D;flex-shrink:0;padding-top:2px;}
.step-title{font-weight:800;font-size:17px;margin-bottom:4px;}
.step-desc{font-size:14px;color:#B9BCC3;line-height:1.4;}

/* CTA banner */
.cta-banner{background:#FFC83D;border-radius:24px;padding:32px 24px;text-align:center;margin-bottom:40px;}
.cta-banner-title{font-weight:900;font-size:28px;color:#0E1013;margin-bottom:8px;line-height:1.1;}
.cta-banner-sub{font-size:15px;color:#5A4800;margin-bottom:20px;}
.cta-banner-btn{height:56px;background:#0E1013;color:#F2F2EE;border:none;border-radius:14px;font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;width:100%;cursor:pointer;}

/* Result screens */
.result-safe{background:#0D1F14;border:1.5px solid #2A5C3A;border-radius:28px;padding:32px 24px;text-align:center;margin-bottom:16px;}
.result-danger{background:#1A0A00;border:1.5px solid #7A2A0A;border-radius:28px;padding:32px 24px;text-align:center;margin-bottom:16px;}
.result-ring-safe{width:160px;height:160px;border-radius:50%;background:#3DDC97;box-shadow:0 0 70px rgba(61,220,151,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;color:#08130D;}
.result-ring-danger{width:160px;height:160px;border-radius:50%;background:#FF6B3D;box-shadow:0 0 70px rgba(255,107,61,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;color:#1A0700;}
.result-word{font-weight:900;font-size:38px;line-height:1;}
.result-sub-word{font-weight:600;font-size:13px;margin-top:4px;}
.result-headline{font-weight:900;font-size:22px;margin-bottom:6px;}
.result-detail{font-size:14px;color:#B9BCC3;}
.meter-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8B8F98;background:#181B20;padding:4px 10px;border-radius:8px;display:inline-block;margin-top:12px;}

/* Info rows */
.info-row{background:#181B20;border-radius:12px;padding:12px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start;}
.info-icon{font-size:16px;flex-shrink:0;}
.info-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#8B8F98;letter-spacing:.05em;text-transform:uppercase;}
.info-val{font-size:13px;font-weight:600;color:#F2F2EE;margin-top:2px;}

/* Action buttons */
.action-btn{width:100%;height:56px;border-radius:14px;border:none;font-family:'Archivo',sans-serif;font-weight:900;font-size:15px;cursor:pointer;margin-top:8px;}
.action-safe{background:#3DDC97;color:#08130D;}
.action-danger{background:#FF6B3D;color:#F2F2EE;}
.action-ghost{background:#181B20;color:#C9CBD1;margin-top:6px;}

/* Modal overlay */
.overlay{position:fixed;inset:0;background:rgba(5,6,8,.8);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#F4F3EE;color:#121418;border-radius:28px 28px 0 0;padding:16px 24px 40px;width:100%;max-width:480px;}
.modal-handle{width:44px;height:5px;border-radius:3px;background:#C7C6C0;margin:0 auto 20px;}
.modal-title{font-weight:900;font-size:24px;line-height:1.1;margin-bottom:8px;}
.modal-sub{font-size:14px;color:#4A4D55;line-height:1.4;margin-bottom:20px;}
.modal-input{width:100%;background:#FFFFFF;border:1.5px solid #D4D3CC;border-radius:12px;padding:14px;color:#121418;font-family:'Archivo',sans-serif;font-size:15px;outline:none;margin-bottom:10px;}
.modal-input:focus{border-color:#FFC83D;}
.modal-btn{width:100%;height:54px;background:#121418;color:#F4F3EE;border:none;border-radius:14px;font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;cursor:pointer;margin-bottom:8px;}
.modal-skip{background:none;border:none;color:#8B8F98;font-size:13px;font-weight:700;cursor:pointer;width:100%;padding:10px;text-align:center;}
.modal-error{color:#FF6B3D;font-size:12px;margin-top:4px;text-align:center;}

footer{border-top:1px solid #22252B;padding:24px;text-align:center;font-size:13px;color:#8B8F98;margin-top:40px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="logo">TOWED</div>
    <div id="credits-display"></div>
  </div>
  <div id="app"></div>
  <footer>© Towed, LLC · towed.nyc<br><span style="font-size:11px">Uses NYC Open Data. Always double-check posted signs.</span></footer>
</div>
<div id="modal-overlay" style="display:none"></div>

<script>
const API = 'https://data.cityofnewyork.us/resource/693u-uax6.json';
const SUPABASE_URL = 'https://vilfzbozignkvszcoffd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ec6gI0EAHKy_tTjHA1KM8g_3j7ENord';

let state = { screen:'home', user:null, credits:3, usedFree:0, result:null, lastMeter:'' };

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('towed_v3') || '{}');
    if (s.user) { state = {...state, ...s, screen:'home', result:null}; }
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem('towed_v3', JSON.stringify({user:state.user,credits:state.credits,usedFree:state.usedFree})); } catch(e) {}
}

function parseHours(h) {
  if (!h) return {safe:true,info:'No restrictions found'};
  const now = new Date(), day=now.getDay(), hour=now.getHours(), str=h.toUpperCase();
  const m = str.match(/(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if (!m) return {safe:true,info:h};
  const start=parseInt(m[1]), end=parseInt(m[3]);
  if (str.includes('MON-SAT') && day===0) return {safe:true,info:'No restrictions on Sunday'};
  if (str.includes('MON-FRI') && (day===0||day===6)) return {safe:true,info:'No restrictions on weekends'};
  if (hour>=start && hour<end) return {safe:false,info:`Restricted now · until ${m[3]}:${m[4]}`};
  return {safe:true,info:`Safe now · restrictions ${m[1]}:${m[2]}–${m[3]}:${m[4]}`};
}

function updateCreditsDisplay() {
  const el = document.getElementById('credits-display');
  if (!el) return;
  if (state.user) {
    const c = state.credits;
    el.innerHTML = `<div class="credits-pill ${c<=1?'warn':''} mono">${c} check${c!==1?'s':''} left</div>`;
  } else if (state.usedFree > 0) {
    const left = 3 - state.usedFree;
    el.innerHTML = `<div class="credits-pill ${left<=1?'warn':''} mono">${left} free check${left!==1?'s':''} left</div>`;
  } else {
    el.innerHTML = `<div class="credits-pill mono">3 free checks</div>`;
  }
}

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home') app.innerHTML = homeHTML();
  else if (state.screen === 'result') app.innerHTML = resultHTML();
  else if (state.screen === 'paywall') app.innerHTML = paywallHTML();
  updateCreditsDisplay();
}

function homeHTML() {
  return `
    <div class="hero">
      <div class="hero-label mono">NYC PARKING, DECODED</div>
      <h1 class="hero-h1">Don't get towed<br>in New York.</h1>
      <p class="hero-sub">Type your meter number. We check NYC's rules right now and tell you: safe or move.</p>
    </div>
    <div class="lookup-box">
      <div class="lookup-label mono">METER LOOKUP</div>
      <input id="meterInput" type="number" placeholder="7-digit meter number" onkeydown="if(event.key==='Enter')checkMeter()"/>
      <button class="check-btn" onclick="checkMeter()">Check my spot →</button>
      <div id="meter-error" class="error-msg"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-num">15K+</div><div class="stat-lbl">NYC meters</div></div>
      <div class="stat"><div class="stat-num">$115</div><div class="stat-lbl">avg ticket</div></div>
      <div class="stat"><div class="stat-num">$300+</div><div class="stat-lbl">avg tow fee</div></div>
    </div>
    <div class="how">
      <div class="section-title">Three taps. Zero tickets.</div>
      <div class="step"><div class="step-num mono">01</div><div><div class="step-title">Find your meter number</div><div class="step-desc">It's on the sticker on the post right next to your car. 7 digits.</div></div></div>
      <div class="step"><div class="step-num mono">02</div><div><div class="step-title">Get one clear answer</div><div class="step-desc">Safe or move now — with the reason in plain English.</div></div></div>
      <div class="step"><div class="step-num mono">03</div><div><div class="step-title">We watch the clock</div><div class="step-desc">Sign up and we alert you before cleaning or meter expires.</div></div></div>
    </div>
    <div class="cta-banner">
      <div class="cta-banner-title">Cheaper than one ticket.</div>
      <div class="cta-banner-sub">3 free checks · then $3.99/mo · 7-day free trial</div>
      <button class="cta-banner-btn" onclick="showSignupModal()">Create free account</button>
    </div>
  `;
}

function resultHTML() {
  const r = state.result;
  const rows = [
    {icon:'📍',label:'Street',val:r.on_street||'N/A'},
    {icon:'🔀',label:'Between',val:`${r.from_street||''} & ${r.to_street||''}`},
    {icon:'🏙',label:'Borough',val:r.borough||'N/A'},
    {icon:'🕐',label:'Meter Hours',val:r.meter_hours||'No restrictions listed'},
    {icon:'📱',label:'Pay By Phone',val:r.pay_by_cell_number?'#'+r.pay_by_cell_number:'N/A'},
  ];
  return `
    <div class="${r.safe?'result-safe':'result-danger'}">
      <div class="${r.safe?'result-ring-safe':'result-ring-danger'}">
        <div class="result-word">${r.safe?'SAFE':'MOVE'}</div>
        <div class="result-sub-word">${r.safe?'to park here':'NOW'}</div>
      </div>
      <div class="result-headline">${r.safe?'Good to go':'Tow risk: HIGH'}</div>
      <div class="result-detail">${r.info}</div>
      <div class="meter-tag mono">METER #${state.lastMeter}</div>
    </div>
    ${rows.map(row=>`
      <div class="info-row">
        <div class="info-icon">${row.icon}</div>
        <div><div class="info-label mono">${row.label}</div><div class="info-val">${row.val}</div></div>
      </div>
    `).join('')}
    <button class="action-btn ${r.safe?'action-safe':'action-danger'}" onclick="goHome()">
      ${r.safe?'I parked here ✓':'Find safe parking nearby →'}
    </button>
    <button class="action-btn action-ghost" onclick="goHome()">← Check another meter</button>
  `;
}

function paywallHTML() {
  return `
    <div style="padding:40px 0;text-align:center;">
      <div style="font-weight:900;font-size:48px;color:#FFC83D;margin-bottom:8px;">3/3</div>
      <div style="font-weight:900;font-size:28px;margin-bottom:12px;">Free checks used up.</div>
      <div style="color:#B9BCC3;font-size:15px;line-height:1.5;margin-bottom:32px;">NYC drivers pay $115–$500+ when they get caught. Towed keeps you protected for less than a MetroCard swipe.</div>
      <div style="background:#181B20;border-radius:20px;padding:24px;margin-bottom:20px;">
        <div style="font-weight:900;font-size:42px;">$3.99<span style="font-size:18px;color:#8B8F98">/mo</span></div>
        <div style="color:#8B8F98;font-size:13px;margin-top:4px;">Unlimited checks · Tow alerts · Sign scanner</div>
      </div>
      <button class="check-btn" onclick="handlePayment()">Start 7-day free trial →</button>
      <div style="color:#8B8F98;font-size:12px;margin-top:12px;">No credit card required for trial</div>
    </div>
  `;
}

function showSignupModal() {
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-overlay').innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Don't get caught like this again.</div>
      <div class="modal-sub">Sign up free and we'll ping you before cleaning, meter, or tow-risk windows hit your car.</div>
      <input class="modal-input" id="m-first" placeholder="First name" />
      <input class="modal-input" id="m-last" placeholder="Last name" />
      <input class="modal-input" id="m-email" type="email" placeholder="Email address" />
      <button class="modal-btn" onclick="signupFromModal()">Create free account →</button>
      <div id="modal-err" class="modal-error"></div>
      <button class="modal-skip" onclick="skipSignup()">Skip for now · ${3-state.usedFree} free check${(3-state.usedFree)!==1?'s':''} left</button>
    </div>
  `;
}

function signupFromModal() {
  const first = document.getElementById('m-first').value.trim();
  const last = document.getElementById('m-last').value.trim();
  const email = document.getElementById('m-email').value.trim();
  const err = document.getElementById('modal-err');
  if (!first) { err.textContent = 'Enter your first name.'; return; }
  if (!last) { err.textContent = 'Enter your last name.'; return; }
  if (!email || !email.includes('@')) { err.textContent = 'Enter a valid email.'; return; }
  state.user = {firstName:first,lastName:last,email};
  state.credits = 10;
  saveState();
  fetch(`${SUPABASE_URL}/rest/v1/signups`,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},
    body:JSON.stringify({first_name:first,last_name:last,email,created_at:new Date().toISOString()})
  }).catch(e=>console.log('Supabase:',e));
  document.getElementById('modal-overlay').style.display = 'none';
  render();
}

function skipSignup() {
  document.getElementById('modal-overlay').style.display = 'none';
}

async function checkMeter() {
  if (!state.user && state.usedFree >= 3) { state.screen='paywall'; render(); return; }
  if (state.user && state.credits <= 0) { state.screen='paywall'; render(); return; }
  const val = document.getElementById('meterInput').value.trim();
  if (!val) return;
  document.getElementById('meter-error').textContent = '';
  document.getElementById('app').innerHTML = '<div style="text-align:center;padding:60px 0;color:#8B8F98;font-size:15px;">Checking NYC parking rules…</div>';
  try {
    const res = await fetch(`${API}?meter_number=${encodeURIComponent(val)}&$limit=1`);
    const data = await res.json();
    if (data && data.length > 0 && data[0].meter_number) {
      const meter = data[0];
      const parsed = parseHours(meter.meter_hours);
      state.result = {...meter,...parsed};
      state.lastMeter = val;
      if (state.user) { state.credits = Math.max(0,state.credits-1); }
      else { state.usedFree++; }
      saveState();
      state.screen = 'result';
      render();
      if (!state.user && state.usedFree === 1) setTimeout(()=>showSignupModal(), 2000);
    } else {
      state.screen = 'home';
      render();
      document.getElementById('meter-error').textContent = 'Meter not found. Check the 7-digit number on the post.';
      document.getElementById('meterInput').value = val;
    }
  } catch(e) {
    state.screen = 'home';
    render();
    document.getElementById('meter-error').textContent = 'Connection error. Try again.';
  }
}

function goHome() {
  if (!state.user && state.usedFree>=3) { state.screen='paywall'; }
  else if (state.user && state.credits<=0) { state.screen='paywall'; }
  else { state.screen='home'; }
  render();
}

function handlePayment() { window.location.href = 'https://buy.stripe.com/test_6oUaEYcdT08nfyI9t3dIA00'; }

loadState();
render();
</script>
</body>
</html>
