<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOWED — NYC Parking Survival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0E1013;font-family:'Archivo','Helvetica Neue',sans-serif;color:#F2F2EE;min-height:100vh;max-width:480px;margin:0 auto;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* Layout */
.screen{min-height:100vh;display:flex;flex-direction:column;padding:0 0 80px 0;}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0;}
.logo{font-weight:900;font-size:22px;letter-spacing:.08em;color:#FFC83D;}
.credits-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 12px;border:1px solid #3A3D44;border-radius:999px;color:#C9CBD1;}
.credits-pill.warn{border-color:#5A3A2E;color:#FFB199;}
.content{flex:1;padding:20px;}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0B0D10;border-top:1px solid #22252B;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 24px;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#8B8F98;cursor:pointer;padding:6px 0;border:none;background:none;}
.nav-item.active{color:#FFC83D;}
.nav-item svg{width:22px;height:22px;}

/* Home */
.hero-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#FFC83D;margin-bottom:14px;}
.hero-h1{font-weight:900;font-size:clamp(38px,9vw,64px);line-height:.95;letter-spacing:-.02em;margin-bottom:14px;}
.hero-sub{font-size:16px;line-height:1.5;color:#B9BCC3;margin-bottom:24px;}
.lookup-box{background:#181B20;border-radius:20px;padding:20px;margin-bottom:14px;}
.lookup-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#8B8F98;margin-bottom:10px;}
input{width:100%;background:#0E1013;border:1.5px solid #3A3D44;border-radius:12px;padding:14px;color:#F2F2EE;font-family:'Archivo',sans-serif;font-size:16px;outline:none;transition:border-color .2s;}
input:focus{border-color:#FFC83D;}
input::placeholder{color:#3A3D44;}
.check-btn{width:100%;height:54px;margin-top:10px;background:#FFC83D;border:none;border-radius:14px;color:#0E1013;font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;cursor:pointer;}
.check-btn:hover{opacity:.9;}
.error-msg{color:#FF6B3D;font-size:12px;margin-top:8px;font-family:'IBM Plex Mono',monospace;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:28px;}
.stat{background:#181B20;border-radius:14px;padding:14px 10px;text-align:center;}
.stat-num{font-weight:900;font-size:20px;color:#FFC83D;}
.stat-lbl{font-size:10px;color:#8B8F98;margin-top:3px;line-height:1.3;}
.how-title{font-weight:900;font-size:26px;margin-bottom:16px;}
.step{background:#181B20;border-radius:14px;padding:18px;margin-bottom:8px;display:flex;gap:14px;align-items:flex-start;}
.step-num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:#FFC83D;flex-shrink:0;padding-top:2px;}
.step-title{font-weight:800;font-size:16px;margin-bottom:3px;}
.step-desc{font-size:13px;color:#B9BCC3;line-height:1.4;}
.cta-banner{background:#FFC83D;border-radius:22px;padding:28px 20px;text-align:center;margin:24px 0;}
.cta-title{font-weight:900;font-size:26px;color:#0E1013;margin-bottom:6px;line-height:1.1;}
.cta-sub{font-size:14px;color:#5A4800;margin-bottom:18px;}
.cta-btn{height:52px;background:#0E1013;color:#F2F2EE;border:none;border-radius:12px;font-family:'Archivo',sans-serif;font-weight:900;font-size:15px;width:100%;cursor:pointer;}

/* Result */
.result-ring-wrap{display:flex;align-items:center;justify-content:center;padding:32px 0 20px;position:relative;}
.ring-outer{width:280px;height:280px;border-radius:50%;border:1px solid #1F2A25;display:flex;align-items:center;justify-content:center;position:relative;}
.ring-mid{width:220px;height:220px;border-radius:50%;border:1px solid #23372D;display:flex;align-items:center;justify-content:center;}
.ring-inner-safe{width:170px;height:170px;border-radius:50%;background:#3DDC97;box-shadow:0 0 80px rgba(61,220,151,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#08130D;}
.ring-inner-danger{width:170px;height:170px;border-radius:50%;background:#FF6B3D;box-shadow:0 0 80px rgba(255,107,61,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1A0700;}
.ring-word{font-weight:900;font-size:42px;line-height:1;}
.ring-sub{font-weight:600;font-size:13px;margin-top:4px;}
.result-headline{font-weight:900;font-size:22px;margin-bottom:4px;padding:0 4px;}
.result-detail{font-size:14px;color:#B9BCC3;padding:0 4px;margin-bottom:16px;}
.meter-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8B8F98;background:#181B20;padding:4px 10px;border-radius:8px;display:inline-block;margin:0 4px 16px;}
.info-row{background:#181B20;border-radius:12px;padding:12px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start;}
.info-icon{font-size:16px;flex-shrink:0;}
.info-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#8B8F98;letter-spacing:.05em;text-transform:uppercase;}
.info-val{font-size:13px;font-weight:600;color:#F2F2EE;margin-top:2px;}
.action-btn{width:100%;height:54px;border-radius:14px;border:none;font-family:'Archivo',sans-serif;font-weight:900;font-size:15px;cursor:pointer;margin-bottom:8px;}
.action-safe{background:#3DDC97;color:#08130D;}
.action-danger{background:#FF6B3D;color:#F2F2EE;}
.action-ghost{background:#181B20;color:#C9CBD1;}

/* Parked Timer */
.timer-header{font-weight:900;font-size:22px;margin-bottom:4px;}
.timer-status{display:flex;align-items:center;gap:8px;font-size:13px;color:#A7AAB2;margin-bottom:24px;}
.timer-dot{width:8px;height:8px;border-radius:50%;background:#3DDC97;}
.timer-wrap{display:flex;align-items:center;justify-content:center;padding:16px 0 24px;position:relative;}
.timer-ring{position:relative;width:260px;height:260px;}
.timer-ring svg{position:absolute;top:0;left:0;}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-time{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:44px;letter-spacing:-.02em;}
.timer-lbl{font-size:13px;color:#A7AAB2;margin-top:4px;}
.timer-row{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:#181B20;font-size:14px;margin-bottom:8px;}
.timer-row-lbl{color:#C9CBD1;}
.timer-row-val{font-weight:800;}
.timer-row-val.accent{color:#FFC83D;}
.walk-btn{width:100%;height:56px;border-radius:16px;border:none;background:#FFC83D;color:#0E1013;font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;}
.moved-btn{width:100%;height:50px;border-radius:16px;border:1px solid #3A3D44;background:none;color:#F2F2EE;font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}

/* Map */
.map-container{position:relative;background:#0D1117;border-radius:20px;overflow:hidden;height:340px;margin-bottom:16px;}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:32px 32px;}
.map-street-h{position:absolute;left:0;right:0;height:6px;background:rgba(255,255,255,.05);}
.map-street-v{position:absolute;top:0;bottom:0;width:6px;background:rgba(255,255,255,.05);}
.map-zone{position:absolute;border-radius:6px;}
.map-zone.high{background:rgba(255,107,61,.18);border:1px solid rgba(255,107,61,.45);}
.map-zone.med{background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);}
.map-zone.low{background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.3);}
.map-user{position:absolute;width:14px;height:14px;border-radius:50%;background:#4DA3FF;border:3px solid #fff;box-shadow:0 0 0 5px rgba(77,163,255,.2);}
.map-legend{display:flex;gap:12px;margin-bottom:16px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#B9BCC3;}
.legend-dot{width:10px;height:10px;border-radius:3px;}
.risk-list-title{font-weight:900;font-size:18px;margin-bottom:12px;}
.risk-item{background:#181B20;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.risk-badge{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.risk-badge.high{background:rgba(255,107,61,.15);}
.risk-badge.med{background:rgba(255,200,61,.15);}
.risk-badge.low{background:rgba(61,220,151,.12);}
.risk-street{font-size:13px;font-weight:700;color:#F2F2EE;}
.risk-detail{font-size:11px;color:#8B8F98;margin-top:2px;}
.risk-dist{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#444460;}

/* Account */
.account-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#FFC83D,#FF6B3D);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#0E1013;margin-bottom:16px;}
.account-name{font-weight:900;font-size:26px;margin-bottom:4px;}
.account-email{font-size:14px;color:#8B8F98;margin-bottom:24px;}
.account-card{background:#181B20;border-radius:16px;padding:20px;margin-bottom:12px;}
.account-card-title{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:#8B8F98;margin-bottom:12px;text-transform:uppercase;}
.plan-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,200,61,.1);border:1px solid rgba(255,200,61,.3);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;color:#FFC83D;margin-bottom:12px;}
.account-stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #22252B;font-size:14px;}
.account-stat:last-child{border-bottom:none;}
.account-stat-lbl{color:#C9CBD1;}
.account-stat-val{font-weight:700;}
.upgrade-btn{width:100%;height:52px;background:#FFC83D;color:#0E1013;border:none;border-radius:12px;font-family:'Archivo',sans-serif;font-weight:900;font-size:15px;cursor:pointer;margin-bottom:8px;}
.signout-btn{width:100%;height:46px;background:none;border:1px solid #3A3D44;color:#8B8F98;border-radius:12px;font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(5,6,8,.85);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#F4F3EE;color:#121418;border-radius:28px 28px 0 0;padding:16px 24px 40px;width:100%;max-width:480px;}
.modal-handle{width:44px;height:5px;border-radius:3px;background:#C7C6C0;margin:0 auto 20px;}
.modal-title{font-weight:900;font-size:22px;line-height:1.1;margin-bottom:8px;}
.modal-sub{font-size:14px;color:#4A4D55;line-height:1.4;margin-bottom:18px;}
.modal-input{width:100%;background:#fff;border:1.5px solid #D4D3CC;border-radius:12px;padding:13px;color:#121418;font-family:'Archivo',sans-serif;font-size:15px;outline:none;margin-bottom:8px;}
.modal-input:focus{border-color:#FFC83D;}
.modal-btn{width:100%;height:52px;background:#121418;color:#F4F3EE;border:none;border-radius:12px;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:8px;}
.modal-skip{background:none;border:none;color:#8B8F98;font-size:13px;font-weight:700;cursor:pointer;width:100%;padding:8px;text-align:center;}
.modal-error{color:#FF6B3D;font-size:12px;margin-top:4px;text-align:center;}

/* Paywall */
.paywall-num{font-weight:900;font-size:56px;color:#FFC83D;text-align:center;margin-bottom:8px;}
.paywall-title{font-weight:900;font-size:28px;text-align:center;margin-bottom:12px;}
.paywall-sub{color:#B9BCC3;font-size:15px;line-height:1.5;text-align:center;margin-bottom:28px;}
.price-card{background:#181B20;border-radius:20px;padding:24px;margin-bottom:20px;text-align:center;}
.price-num{font-weight:900;font-size:42px;}
.price-lbl{color:#8B8F98;font-size:13px;margin-top:4px;}
</style>
</head>
<body>

<div id="root"></div>
<div id="modal-overlay" style="display:none"></div>

<script>
const API = 'https://data.cityofnewyork.us/resource/693u-uax6.json';
const SUPABASE_URL = 'https://vilfzbozignkvszcoffd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ec6gI0EAHKy_tTjHA1KM8g_3j7ENord';
const STRIPE_LINK = 'https://buy.stripe.com/test_6oUaEYcdT08nfyI9t3dIA00';

let state = {
  screen: 'home',
  nav: 'check',
  user: null,
  credits: 3,
  usedFree: 0,
  result: null,
  lastMeter: '',
  parkedAt: null,
  parkedExpiry: null,
  timerInterval: null,
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('towed_v4') || '{}');
    if (s.user) state = {...state, ...s, screen:'home', result:null};
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('towed_v4', JSON.stringify({
      user:state.user, credits:state.credits, usedFree:state.usedFree,
      parkedAt:state.parkedAt, parkedExpiry:state.parkedExpiry
    }));
  } catch(e) {}
}

function parseHours(h) {
  if (!h) return {safe:true,info:'No restrictions found'};
  const now=new Date(), day=now.getDay(), hour=now.getHours(), str=h.toUpperCase();
  const m=str.match(/(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if (!m) return {safe:true,info:h};
  const start=parseInt(m[1]), end=parseInt(m[3]);
  if (str.includes('MON-SAT')&&day===0) return {safe:true,info:'No restrictions on Sunday'};
  if (str.includes('MON-FRI')&&(day===0||day===6)) return {safe:true,info:'No restrictions on weekends'};
  if (hour>=start&&hour<end) return {safe:false,info:`Restricted now · until ${m[3]}:${m[4]}`};
  return {safe:true,info:`Safe now · restrictions ${m[1]}:${m[2]}–${m[3]}:${m[4]}`};
}

function creditsDisplay() {
  if (state.user) {
    const c=state.credits;
    return `<div class="credits-pill mono ${c<=1?'warn':''}">${c} check${c!==1?'s':''} left</div>`;
  }
  if (state.usedFree>0) {
    const left=3-state.usedFree;
    return `<div class="credits-pill mono ${left<=1?'warn':''}">${left} free left</div>`;
  }
  return `<div class="credits-pill mono">3 free checks</div>`;
}

function navHTML(active) {
  const items=[
    {id:'check',icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>`,label:'Check'},
    {id:'map',icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>`,label:'Map'},
    {id:'parked',icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.5-5a2 2 0 0 1 2-1.4h7a2 2 0 0 1 2 1.4L19 16"/><rect x="4" y="16" width="16" height="3" rx="1"/></svg>`,label:'My Car'},
    {id:'account',icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`,label:'Account'},
  ];
  return `<nav class="bottom-nav">${items.map(i=>`
    <button class="nav-item ${active===i.id?'active':''}" onclick="goNav('${i.id}')">${i.icon}${i.label}</button>
  `).join('')}</nav>`;
}

function render() {
  const root=document.getElementById('root');
  if (state.screen==='home') root.innerHTML=homeHTML();
  else if (state.screen==='result') root.innerHTML=resultHTML();
  else if (state.screen==='paywall') root.innerHTML=paywallHTML();
  else if (state.screen==='map') root.innerHTML=mapHTML();
  else if (state.screen==='parked') root.innerHTML=parkedHTML();
  else if (state.screen==='account') root.innerHTML=accountHTML();
  if (state.screen==='parked') startTimer();
}

function homeHTML() {
  return `
    <div class="screen">
      <div class="top-bar"><div class="logo">TOWED</div>${creditsDisplay()}</div>
      <div class="content">
        <div style="height:16px"></div>
        <div class="hero-label mono">NYC PARKING, DECODED</div>
        <h1 class="hero-h1">Don't get towed<br>in New York.</h1>
        <p class="hero-sub">Type your meter number. We check NYC rules right now and tell you: safe or move.</p>
        <div class="lookup-box">
          <div class="lookup-label mono">METER LOOKUP</div>
          <input id="meterInput" type="number" placeholder="7-digit meter number" onkeydown="if(event.key==='Enter')checkMeter()"/>
          <button class="check-btn" onclick="checkMeter()">Check my spot →</button>
          <div id="meter-error" class="error-msg"></div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-num">15K+</div><div class="stat-lbl">NYC meters</div></div>
          <div class="stat"><div class="stat-num">$115</div><div class="stat-lbl">avg ticket</div></div>
          <div class="stat"><div class="stat-num">$300+</div><div class="stat-lbl">avg tow fee</div></div>
        </div>
        <div class="how-title">Three taps. Zero tickets.</div>
        <div class="step"><div class="step-num mono">01</div><div><div class="step-title">Find your meter number</div><div class="step-desc">It's on the sticker on the post right next to your car. 7 digits.</div></div></div>
        <div class="step"><div class="step-num mono">02</div><div><div class="step-title">Get one clear answer</div><div class="step-desc">Safe or move now — with the reason in plain English.</div></div></div>
        <div class="step"><div class="step-num mono">03</div><div><div class="step-title">We watch the clock</div><div class="step-desc">Sign up and we alert you before cleaning or meter expires.</div></div></div>
        <div class="cta-banner">
          <div class="cta-title">Cheaper than one ticket.</div>
          <div class="cta-sub">3 free checks · then $3.99/mo · 7-day free trial</div>
          <button class="cta-btn" onclick="showSignupModal()">Create free account</button>
        </div>
      </div>
      ${navHTML('check')}
    </div>
  `;
}

function resultHTML() {
  const r=state.result;
  const safe=r.safe;
  const rows=[
    {icon:'📍',label:'Street',val:r.on_street||'N/A'},
    {icon:'🔀',label:'Between',val:`${r.from_street||''} & ${r.to_street||''}`},
    {icon:'🏙',label:'Borough',val:r.borough||'N/A'},
    {icon:'🕐',label:'Meter Hours',val:r.meter_hours||'No restrictions listed'},
    {icon:'📱',label:'Pay By Phone',val:r.pay_by_cell_number?'#'+r.pay_by_cell_number:'N/A'},
  ];
  return `
    <div class="screen">
      <div class="top-bar"><div class="logo">TOWED</div>${creditsDisplay()}</div>
      <div class="content">
        <div class="result-ring-wrap">
          <div class="ring-outer">
            <div class="ring-mid">
              <div class="${safe?'ring-inner-safe':'ring-inner-danger'}">
                <div class="ring-word">${safe?'SAFE':'MOVE'}</div>
                <div class="ring-sub">${safe?'to park here':'NOW'}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="result-headline">${safe?'Good to go':'Tow risk: HIGH'}</div>
        <div class="result-detail">${r.info}</div>
        <div class="meter-tag mono">METER #${state.lastMeter}</div>
        ${rows.map(row=>`
          <div class="info-row">
            <div class="info-icon">${row.icon}</div>
            <div><div class="info-label mono">${row.label}</div><div class="info-val">${row.val}</div></div>
          </div>
        `).join('')}
        ${safe?`<button class="action-btn action-safe" onclick="iParkHere()">I parked here ✓</button>`:''}
        <button class="action-btn ${safe?'action-ghost':'action-danger'}" onclick="goHome()">${safe?'← Check another':'Find safe parking →'}</button>
      </div>
      ${navHTML('check')}
    </div>
  `;
}

function parkedHTML() {
  const expiry=state.parkedExpiry?new Date(state.parkedExpiry):null;
  const expiryStr=expiry?expiry.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'--:--';
  const street=state.result?.on_street||'Your spot';
  const cleaning=state.result?.meter_hours||'Check posted signs';
  return `
    <div class="screen">
      <div class="top-bar"><div style="font-weight:900;font-size:20px">Your car</div><div class="timer-status"><div class="timer-dot"></div>Live alerts on</div></div>
      <div class="content">

// ── Timer ──────────────────────────────────────────────
function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  updateTimerDisplay();
  state.timerInterval = setInterval(updateTimerDisplay, 1000);
}

function updateTimerDisplay() {
  const el=document.getElementById('timer-display');
  if (!el) { clearInterval(state.timerInterval); return; }
  if (!state.parkedExpiry) { el.textContent='--:--'; return; }
  const now=new Date(), expiry=new Date(state.parkedExpiry);
  const diff=Math.max(0,expiry-now);
  const h=Math.floor(diff/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  el.textContent=h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ── Actions ────────────────────────────────────────────
function goNav(id) {
  if (id==='check') { state.screen='home'; }
  else if (id==='map') { state.screen='map'; }
  else if (id==='parked') { state.screen='parked'; }
  else if (id==='account') { state.screen='account'; }
  render();
}

function iParkHere() {
  const expiry=new Date();
  expiry.setHours(expiry.getHours()+2);
  state.parkedAt=new Date().toISOString();
  state.parkedExpiry=expiry.toISOString();
  saveState();
  state.screen='parked';
  render();
}

function goHome() {
  if (!state.user&&state.usedFree>=3) { state.screen='paywall'; }
  else if (state.user&&state.credits<=0) { state.screen='paywall'; }
  else { state.screen='home'; }
  render();
}

async function checkMeter() {
  if (!state.user&&state.usedFree>=3) { state.screen='paywall'; render(); return; }
  if (state.user&&state.credits<=0) { state.screen='paywall'; render(); return; }
  const val=document.getElementById('meterInput').value.trim();
  if (!val) return;
  document.getElementById('meter-error').textContent='';
  document.getElementById('root').innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#8B8F98;font-size:15px;font-family:Archivo,sans-serif;">Checking NYC parking rules…</div>';
  try {
    const res=await fetch(`${API}?meter_number=${encodeURIComponent(val)}&$limit=1`);
    const data=await res.json();
    if (data&&data.length>0&&data[0].meter_number) {
      const meter=data[0];
      const parsed=parseHours(meter.meter_hours);
      state.result={...meter,...parsed};
      state.lastMeter=val;
      if (state.user) state.credits=Math.max(0,state.credits-1);
      else state.usedFree++;
      saveState();
      state.screen='result';
      render();
      if (!state.user&&state.usedFree===1) setTimeout(()=>showSignupModal(),2000);
    } else {
      state.screen='home'; render();
      document.getElementById('meter-error').textContent='Meter not found. Check the 7-digit number on the post.';
      document.getElementById('meterInput').value=val;
    }
  } catch(e) {
    state.screen='home'; render();
    document.getElementById('meter-error').textContent='Connection error. Try again.';
  }
}

function showSignupModal() {
  const left=3-state.usedFree;
  document.getElementById('modal-overlay').style.display='flex';
  document.getElementById('modal-overlay').innerHTML=`
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Don't get caught like this again.</div>
      <div class="modal-sub">Sign up free and we'll ping you before cleaning, meter, or tow-risk windows hit your car.</div>
      <input class="modal-input" id="m-first" placeholder="First name"/>
      <input class="modal-input" id="m-last" placeholder="Last name"/>
      <input class="modal-input" id="m-email" type="email" placeholder="Email address"/>
      <button class="modal-btn" onclick="signupFromModal()">Create free account →</button>
      <div id="modal-err" class="modal-error"></div>
      <button class="modal-skip" onclick="skipSignup()">Skip for now · ${left} free check${left!==1?'s':''} left</button>
    </div>
  `;
}

function signupFromModal() {
  const first=document.getElementById('m-first').value.trim();
  const last=document.getElementById('m-last').value.trim();
  const email=document.getElementById('m-email').value.trim();
  const err=document.getElementById('modal-err');
  if (!first){err.textContent='Enter your first name.';return;}
  if (!last){err.textContent='Enter your last name.';return;}
  if (!email||!email.includes('@')){err.textContent='Enter a valid email.';return;}
  state.user={firstName:first,lastName:last,email};
  state.credits=10;
  saveState();
  fetch(`${SUPABASE_URL}/rest/v1/signups`,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},
    body:JSON.stringify({first_name:first,last_name:last,email,created_at:new Date().toISOString()})
  }).catch(e=>console.log('Supabase:',e));
  document.getElementById('modal-overlay').style.display='none';
  render();
}

function skipSignup() {
  document.getElementById('modal-overlay').style.display='none';
}

function signOut() {
  state.user=null; state.credits=3; state.usedFree=0;
  localStorage.removeItem('towed_v4');
  state.screen='home'; render();
}

loadState();
render();
</script>
