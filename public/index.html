let state = {
  screen:'home', user:null, credits:10, usedFree:0,
  result:null, lastMeter:'', parkedAt:null, parkedExpiry:null,
  timerInterval:null, deviceId:null, history:[], saved:[], totalChecks:0
};

function loadState() {
  try {
    let did = localStorage.getItem('towed_did');
    if (!did) { did = 'dev_' + Math.random().toString(36).substr(2,9) + Date.now().toString(36); localStorage.setItem('towed_did', did); }
    state.deviceId = did;
    const s = JSON.parse(localStorage.getItem('towed_v6') || '{}');
    if (s.user) state = {...state, ...s, screen:'home', result:null};
    const dc = parseInt(localStorage.getItem('towed_dc') || '0');
    if (!state.user && dc >= 3) state.usedFree = 3;
    state.totalChecks = parseInt(localStorage.getItem('towed_tc') || '1247');
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('towed_v6', JSON.stringify({
      user:state.user, credits:state.credits, usedFree:state.usedFree,
      parkedAt:state.parkedAt, parkedExpiry:state.parkedExpiry,
      history:state.history, saved:state.saved
    }));
  } catch(e) {}
}

function parseHours(h) {
  if (!h) return {safe:true, info:'No restrictions found'};
  const now=new Date(), day=now.getDay(), hour=now.getHours(), str=h.toUpperCase();
  const m=str.match(/(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if (!m) return {safe:true, info:h};
  const start=parseInt(m[1]), end=parseInt(m[3]);
  if (str.includes('MON-SAT')&&day===0) return {safe:true, info:'No restrictions on Sunday'};
  if (str.includes('MON-FRI')&&(day===0||day===6)) return {safe:true, info:'No restrictions on weekends'};
  if (hour>=start&&hour<end) return {safe:false, info:'Restricted now · until '+m[3]+':'+m[4]};
  return {safe:true, info:'Safe now · restrictions '+m[1]+':'+m[2]+'–'+m[3]+':'+m[4]};
}

function getExpiry(meterHours) {
  const now=new Date();
  if (!meterHours) return new Date(now.getTime()+2*3600000);
  const m=meterHours.toUpperCase().match(/(\d{2})(\d{2})-(\d{2})(\d{2})/);
  if (m) {
    const e=new Date(); e.setHours(parseInt(m[3]),parseInt(m[4]),0,0);
    if (e<=now) return new Date(now.getTime()+2*3600000);
    return e;
  }
  return new Date(now.getTime()+2*3600000);
}

function cp() {
  if (state.user) { const c=state.credits; return '<div class="credits-pill'+(c<=2?' warn':'')+'">'+c+' check'+(c!==1?'s':'')+' left</div>'; }

  return '<div class="credits-pill">Free to use</div>';
}

}

}

async function loadNearby(lat, lng) {
  const st=document.getElementById('map-status');
  const li=document.getElementById('nearby-list');
  if (st) st.textContent='📍 Showing meters near you';
  try {
    const d=0.004;
    const res=await fetch(API+'?$where=lat>'+(lat-d)+' AND lat<'+(lat+d)+' AND long>'+(lng-d)+' AND long<'+(lng+d)+'&$limit=10');
    const data=await res.json();
    if (!data||data.length===0) { if (li) li.innerHTML='<div style="text-align:center;padding:20px;color:#8B8F98;font-size:13px">No meters found nearby.</div>'; return; }
    if (li) li.innerHTML=data.map(function(m){
      const p=parseHours(m.meter_hours), safe=p.safe;
      return '<div class="risk-item" onclick="quickCheck(\''+m.meter_number+'\')">'+
        '<div class="risk-badge" style="background:'+(safe?'rgba(61,220,151,.12)':'rgba(255,107,61,.15)')+'">'+(safe?'✅':'🚨')+'</div>'+
        '<div style="flex:1"><div style="font-size:12px;font-weight:700">'+(m.on_street||'Unknown')+'</div>'+
        '<div style="font-size:10px;color:#8B8F98">Meter #'+m.meter_number+' · '+(m.borough||'')+'</div>'+
        '<div style="font-size:10px;color:'+(safe?'#3DDC97':'#FF6B3D')+';margin-top:2px">'+p.info+'</div></div>'+
        '<div style="font-size:10px;color:'+(safe?'#3DDC97':'#FF6B3D')+';font-weight:700">'+(safe?'SAFE':'RISK')+'</div>'+
        '</div>';
    }).join('');
  } catch(e) { if (li) li.innerHTML='<div style="text-align:center;padding:20px;color:#8B8F98;font-size:13px">Could not load nearby meters.</div>'; }
}

function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  updateTimer();
  state.timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
  const el=document.getElementById('timer-display');
  const arc=document.getElementById('timer-arc');
  if (!el) { clearInterval(state.timerInterval); return; }
  if (!state.parkedExpiry) { el.textContent='--:--'; return; }
  const now=new Date(), exp=new Date(state.parkedExpiry), pa=new Date(state.parkedAt);
  const total=exp-pa, diff=Math.max(0,exp-now), pct=total>0?diff/total:0;
  const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  if (diff===0) { el.textContent='EXPIRED'; el.style.color='#FF6B3D'; }
  else {
    el.textContent=h>0?h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    el.style.color=diff<600000?'#FF6B3D':diff<1800000?'#FFD60A':'#F2F2EE';
  }
  if (arc) { arc.style.strokeDashoffset=666*(1-pct); arc.style.stroke=diff<600000?'#FF6B3D':diff<1800000?'#FFD60A':'#FFC83D'; }
}

function reqNotif(expiry, street) {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(function(p){ if (p==='granted') schedNotif(expiry, street); });
}

function schedNotif(expiry, street) {
  const now=new Date(), exp=new Date(expiry);
  const t30=exp.getTime()-1800000-now.getTime();
  const t10=exp.getTime()-600000-now.getTime();
  const t0=exp.getTime()-now.getTime();
  if (t30>0) setTimeout(function(){ new Notification('🚗 TOWED — Move Your Car',{body:'Meter expires in 30 min on '+street,requireInteraction:true}); },t30);
  if (t10>0) setTimeout(function(){ new Notification('⚠️ TOWED — 10 Minutes Left',{body:'Meter expires in 10 min on '+street+'. Move NOW!',requireInteraction:true}); },t10);
  if (t0>0) setTimeout(function(){ new Notification('🚨 TOWED — Meter Expired',{body:'Your meter on '+street+' has expired!',requireInteraction:true}); },t0);
}

function iParkHere() {
  const r=state.result; if (!r) return;
  const exp=getExpiry(r.meter_hours);
  state.parkedAt=new Date().toISOString();
  state.parkedExpiry=exp.toISOString();
  saveState();
  reqNotif(exp, r.on_street||'your spot');
  state.screen='parked'; render();
}

function saveSpot() {
  if (!state.result||!state.user) return;
  if (!state.saved) state.saved=[];
  const exists=state.saved.find(function(s){ return s.meter===state.lastMeter; });
  if (!exists) {
    state.saved.unshift({meter:state.lastMeter, street:state.result.on_street||'Unknown', borough:state.result.borough||''});
    if (state.saved.length>10) state.saved=state.saved.slice(0,10);
    saveState();
    alert('Spot saved! Find it in your Account tab.');
  } else {
    alert('This spot is already saved.');
  }
}

async function checkMeter() {

  const val=document.getElementById('meterInput').value.trim();
  if (!val) return;
  document.getElementById('meter-error').textContent='';
  document.getElementById('root').innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#8B8F98;font-size:15px;font-family:Archivo,sans-serif">Checking NYC parking rules…</div>';
  try {
    const res=await fetch(API+'?meter_number='+encodeURIComponent(val)+'&$limit=1');
    const data=await res.json();
    if (data&&data.length>0&&data[0].meter_number) {
      const meter=data[0], parsed=parseHours(meter.meter_hours);
      state.result=Object.assign({},meter,parsed);
      state.lastMeter=val;
      if (state.user) state.credits=Math.max(0,state.credits-1);
      else {
        state.usedFree++;
        const dc=parseInt(localStorage.getItem('towed_dc')||'0');
        localStorage.setItem('towed_dc',dc+1);
      }
      // Add to history
      if (!state.history) state.history=[];
      state.history.unshift({meter:val, street:meter.on_street||'Unknown', safe:parsed.safe, time:new Date().toISOString()});
      if (state.history.length>5) state.history=state.history.slice(0,5);
      // Increment counter
      state.totalChecks++;
      localStorage.setItem('towed_tc', state.totalChecks);
      saveState();
      state.screen='result'; render();
      if (!state.user&&state.usedFree===1) setTimeout(showSignupModal,2000);
    } else {
      state.screen='home'; render();
      document.getElementById('meter-error').textContent='Meter not found. Check the 7-digit number on the post.';
      document.getElementById('meterInput').value=val;
    }
  } catch(e) {
    state.screen='home'; render();
    document.getElementById('meter-error').textContent='Connection error. Try again.';
  }
}

async function quickCheck(meterNum) {
  state.screen='home'; render();
  setTimeout(function(){
    const inp=document.getElementById('meterInput');
    if (inp) { inp.value=meterNum; checkMeter(); }
  },150);
}

function showSignupModal() {
  const left=Math.max(0,3-state.usedFree);
  document.getElementById('modal-overlay').style.display='flex';
  document.getElementById('modal-overlay').innerHTML=
    '<div class="modal">'+
    '<div class="modal-handle"></div>'+
    '<div class="modal-title">Don\'t get caught like this again.</div>'+
    '<div class="modal-sub">Sign up free and we\'ll ping you before cleaning, meter, or tow-risk windows hit your car.</div>'+
    '<input class="modal-input" id="m-first" placeholder="First name"/>'+
    '<input class="modal-input" id="m-last" placeholder="Last name"/>'+
    '<input class="modal-input" id="m-email" type="email" placeholder="Email address"/>'+
    '<input class="modal-input" id="m-password" type="password" placeholder="Create a password (min 6 characters)"/>'+
    '<button style="width:100%;height:50px;background:#121418;color:#F4F3EE;border:none;border-radius:11px;font-family:Archivo,sans-serif;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:8px" onclick="signupFromModal()">Create free account →</button>'+
    '<div id="modal-err" class="modal-err" style="color:#FF6B3D;font-size:11px;text-align:center;margin-top:4px"></div>'+
    '<button class="modal-skip" onclick="skipSignup()">Skip for now · '+left+' free check'+(left!==1?'s':'')+' left</button>'+
    '</div>';
}

function signupFromModal() {
  const first=document.getElementById('m-first').value.trim();
  const last=document.getElementById('m-last').value.trim();
  const email=document.getElementById('m-email').value.trim();
  const password=document.getElementById('m-password').value.trim();
  const err=document.getElementById('modal-err');
  if (!first){err.textContent='Enter your first name.';return;}
  if (!last){err.textContent='Enter your last name.';return;}
  if (!email||!email.includes('@')){err.textContent='Enter a valid email.';return;}
  if (!password||password.length<6){err.textContent='Password must be at least 6 characters.';return;}
  state.user={firstName:first,lastName:last,email:email};
  state.credits=10;
  saveState();
  fetch(SB_URL+'/rest/v1/Sign%20ups',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
    body:JSON.stringify({first_name:first,last_name:last,email:email,password:password,created_at:new Date().toISOString()})
  }).catch(function(e){console.log('SB:',e);});
  // Show success screen
  document.getElementById('modal-overlay').innerHTML=
    '<div class="modal" style="text-align:center">'+
    '<div style="font-size:52px;margin-bottom:14px">🎉</div>'+
    '<div style="font-weight:900;font-size:22px;color:#121418;margin-bottom:8px">You\'re in, '+first+'!</div>'+
    '<div style="font-size:13px;color:#4A4D55;margin-bottom:18px">Welcome to Towed. You have 10 free checks and a 7-day trial to explore everything.</div>'+
    '<div style="background:#0E1013;border-radius:10px;padding:12px;margin-bottom:18px">'+
    '<div style="font-size:11px;color:#8B8F98;margin-bottom:3px">Signed in as</div>'+
    '<div style="font-size:14px;font-weight:700;color:#F2F2EE">'+email+'</div>'+
    '</div>'+
    '<button style="width:100%;height:50px;background:#121418;color:#F4F3EE;border:none;border-radius:11px;font-family:Archivo,sans-serif;font-weight:800;font-size:15px;cursor:pointer" onclick="closeModal()">Start checking meters →</button>'+
    '</div>';
}

function closeModal() {
  document.getElementById('modal-overlay').style.display='none';
  render();
}

function skipSignup() {
  document.getElementById('modal-overlay').style.display='none';
}

function goNav(id) {
  if (id==='home'||id==='check') state.screen='home';
  else if (id==='map') state.screen='map';
  else if (id==='parked') state.screen='parked';
  else if (id==='account') state.screen='account';
  else if (id==='privacy') state.screen='privacy';
  else if (id==='terms') state.screen='terms';
  else if (id==='faq') state.screen='faq';
  else if (id==='about') state.screen='about';
  render();
}

function goHome() {
  state.screen='home';
}

function signOut() {
  const dc=parseInt(localStorage.getItem('towed_dc')||'0');
  state.user=null; state.credits=10; state.usedFree=dc;
  localStorage.removeItem('towed_v6');
  state.screen='home'; render();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function(e){console.log('SW:',e);});
}

loadState();
render();
</script>
</body>
</html>
